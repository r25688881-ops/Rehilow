name: update-data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"   # 台灣 14:30，收盤後
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      - run: python fetch_taiex.py
      - run: python 回測.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "update data" || echo "no changes"
          git push
