name: update-data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"   # 台灣 14:30（收盤後）
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python fetch_taiex.py
      - run: python backtest.py
      - run: python fetch_stocks.py
      - run: python stock_signals.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add taiex.csv signals.json stocks_hist.json stocks.json
          git commit -m "update data" || echo "no changes"
          git pull --rebase
          git push
